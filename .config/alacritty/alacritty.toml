# colors are extracted from https://github.com/alacritty/alacritty-theme
#import = [
#    "~/.config/alacritty/themes/themes/nord.toml"
#
#]
[colors.bright]
black = "#5a5f42"
blue = "#86a9bd"
cyan = "#9fc4b6"
green = "#a8b962"
magenta = "#c78f96"
red = "#e0754a"
white = "#f2e8cf"
yellow = "#f0c54f"

[colors.normal]
black = "#2a2f1c"
blue = "#6b97ad"
cyan = "#7fa89b"
green = "#8a9a4a"
magenta = "#c0858d"
red = "#d16a3e"
white = "#d9cfb2"
yellow = "#d9a62b"

[colors.primary]
background = "#1c2113"
foreground = "#e6c98d"

[colors.cursor]
cursor = "#f0c54f"
text = "#1c2113"

[colors.selection]
background = "#43482c"
text = "#f2e8cf"

[cursor]
blink_interval = 1500
thickness = 0.2

[terminal.shell]
program = "/usr/bin/fish"

[cursor.style]
blinking = "Always"
shape = "Beam"

[env]
LANG = "en_US.UTF-8"
LC_CTYPE = "en_US.UTF-8"
TERM = "alacritty"

[font]
size = 8.8

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "Return"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "Return"
mods = "Control|Alt"

[[keyboard.bindings]]
action = "ScrollLineUp"
key = "PageUp"
mods = "None"

[[keyboard.bindings]]
action = "ScrollLineDown"
key = "PageDown"
mods = "None"

[scrolling]
multiplier = 3

[selection]
save_to_clipboard = true

[window]
opacity = 0.8

[window.dimensions]
columns = 100
lines = 25

[window.padding]
x = 5
y = 5

[window.position]
x = 1450
y = 600

[general]
live_config_reload = true

[terminal]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

# Shadows /usr/share/sway/config.d/90-bar.conf, which contains:
#
#     bar {
#         swaybar_command waybar
#     }
#
# That starts a single waybar process covering every output, and waybar's
# SIGUSR1 show/hide toggle applies to all bars a process owns -- so hiding
# one output's bar would hide them all.
#
# Instead ~/.config/waybar/per-output.sh starts one waybar per output; it is
# launched from the `exec` line in ~/.config/sway/config. Deliberately no
# `bar` block here.

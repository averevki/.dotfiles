# Key bindings for taking screenshots.
#
# Shadows /usr/share/sway/config.d/60-bindings-screenshot.conf (the grimshot
# defaults). These save a PNG under ~/Pictures/Screenshots and also copy it
# to the clipboard.
#
# Requires:     grim, slurp, wl-clipboard, jq, xdg-user-dir

bindsym {
    # Capture the currently active output
    Print       exec grim -o "$(swaymsg -t get_outputs | jq -r '.[] | select(.focused) | .name')" - | tee "$(xdg-user-dir PICTURES)/Screenshots/$(date +%Y%m%d-%H%M%S).png" | wl-copy -t image/png
    # Select and capture a custom rectangular area. The && leaves the clipboard
    # and the disk untouched when the selection is cancelled with Escape.
    Ctrl+Print  exec geom=$(slurp -d) && grim -g "$geom" - | tee "$(xdg-user-dir PICTURES)/Screenshots/$(date +%Y%m%d-%H%M%S).png" | wl-copy -t image/png
}

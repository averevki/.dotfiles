# Output profile: two Dell P2419H side by side on a stand, laptop panel on
# the desk below, centred under the pair.
# Selected by detect-outputs.sh when Dell serial 77C9BR2 is connected.
#
# Both Dells report the same make and model, so the trailing serial is the
# only part of the identifier that tells them apart -- don't drop it.
#
#        0        1920      3840
#    0   +---------+---------+      the two Dells, 1920x1080 each
#        | 35C9BR2 | 77C9BR2 |
# 1080   +--+------+------+--+
#           |  laptop     |         2240x1400, centred: (3840-2240)/2 = 800
# 2480      +-------------+
#          800          3040

# Dell P2419H, 24" 1080p -- top left
output "Dell Inc. DELL P2419H 35C9BR2" {
    mode 1920x1080@60Hz
    position 0,0
}

# Dell P2419H, 24" 1080p -- top right
output "Dell Inc. DELL P2419H 77C9BR2" {
    mode 1920x1080@60Hz
    position 1920,0
}

# Built-in laptop panel -- below, centred
output "BOE 0x0AC9 Unknown" {
    mode 2240x1400@60.002Hz
    position 800,1080
}

workspace 1 output "Dell Inc. DELL P2419H 35C9BR2"
workspace 2 output "Dell Inc. DELL P2419H 35C9BR2"
workspace 3 output "Dell Inc. DELL P2419H 77C9BR2"
workspace 4 output "Dell Inc. DELL P2419H 77C9BR2"
workspace 5 output "BOE 0x0AC9 Unknown"
